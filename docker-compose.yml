version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gts_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${DB_NAME:-gts_kavachiq_db}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - gts_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-gts_kavachiq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: gts_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secure_pass}@postgres:5432/${DB_NAME:-gts_kavachiq_db}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-gts_kavachiq_super_secure_access_secret_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-gts_kavachiq_super_secure_refresh_secret_2026}
      LICENSE_SIGNING_SECRET: ${LICENSE_SIGNING_SECRET:-gts_kavachiq_master_license_signing_key_secret_2026}
      DOWNLOAD_TOKEN_SECRET: ${DOWNLOAD_TOKEN_SECRET:-gts_kavachiq_storage_download_hmac_secret_2026}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
    ports:
      - "5000:5000"

  web:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: gts_web
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  gts_pgdata:
